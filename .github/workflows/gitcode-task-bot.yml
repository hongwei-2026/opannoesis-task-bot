# GitHub Actions ↔ GitCode Issues
# 定时扫描 OpenNoesis/vllm 评论，用 GitCode PAT 发回复（不依赖本机、不依赖 GitCode CI）
name: gitcode-task-bot

on:
  schedule:
    # GitHub 对过密 cron 可能降频；用 */10 更稳，并保留手动触发
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # 推送本仓也跑一轮，避免 schedule 长时间不触发
  push:
    branches: [main]
    paths:
      - "team/**"
      - ".github/workflows/gitcode-task-bot.yml"
  # 每天 UTC 02:00 跑一次 14 天释放
  # （与 comment 轮询合并在同一个 workflow 的不同 job）

permissions:
  contents: write

jobs:
  poll-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache 作加速；真正防回放靠仓库内 .poll_state.json + bootstrap
      - uses: actions/cache@v4
        with:
          path: .poll_state.json
          key: poll-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            poll-state-${{ github.repository }}-
            poll-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll GitCode & reply
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITCODE_OWNER: OpenNoesis
          GITCODE_REPO: vllm
          TASK_BOT_NO_GIT: "1"
          TASK_BOT_POLL_STATE: ${{ github.workspace }}/.poll_state.json
          CI_GITHUB_REPO: hongwei-2026/opannoesis-vllm-ci
          CI_WORKFLOW_FILE: vllm-gate.yml
        run: python team/scripts/poll_once.py

      - name: Commit poll cursor (durable, no history replay)
        if: always()
        run: |
          if [ ! -f .poll_state.json ]; then
            echo "no poll state"
            exit 0
          fi
          git config user.name "opannoesis-task-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin main || git pull --rebase origin main || true
          git add .poll_state.json
          if git diff --cached --quiet; then
            echo "poll state unchanged"
          else
            git commit -m "chore: update poll cursor" || true
            git pull --rebase origin main || true
            git push || git push --force-with-lease || echo "push failed; cache still has state"
          fi

  stale-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 仅在整点附近的 schedule 里跑（避免每 5 分钟释放扫描）
    # workflow_dispatch 也可手动跑
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 14-day idle release
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: OpenNoesis
          GITCODE_REPO: vllm
          TASK_BOT_NO_GIT: "1"
          TASK_BOT_MODE: stale
        run: |
          # schedule 只有 */5，用小时判断：仅 UTC 02:00–02:04 执行
          H=$(date -u +%H)
          M=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$H" = "02" ] && [ "$M" -lt 5 ]; }; then
            python team/scripts/task_bot.py
          else
            echo "skip stale this tick"
          fi
