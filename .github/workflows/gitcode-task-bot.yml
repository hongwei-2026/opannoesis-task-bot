# GitHub Actions ↔ GitCode Issues
name: gitcode-task-bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "team/scripts/**"
      - ".github/workflows/gitcode-task-bot.yml"

permissions:
  contents: write

# 同时只跑一轮，避免两个 job 抢推 .poll_state.json
concurrency:
  group: gitcode-task-bot-poll
  cancel-in-progress: false

jobs:
  poll-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll GitCode & reply
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITCODE_OWNER: OpenNoesis
          GITCODE_REPO: vllm
          TASK_BOT_NO_GIT: "1"
          TASK_BOT_POLL_STATE: ${{ github.workspace }}/.poll_state.json
          CI_GITHUB_REPO: hongwei-2026/opannoesis-vllm-ci
          CI_WORKFLOW_FILE: vllm-gate.yml
        run: python team/scripts/poll_once.py

      - name: Commit poll cursor
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f .poll_state.json ]; then
            echo "no poll state"
            exit 0
          fi
          git config user.name "opannoesis-task-bot"
          git config user.email "bot@users.noreply.github.com"

          # 只提交 cursor；忽略 task_bot 可能改动的其它文件
          git add .poll_state.json
          if git diff --cached --quiet; then
            echo "poll state unchanged"
            exit 0
          fi
          git commit -m "chore: update poll cursor"

          # 并发推送时 rebase 重试，失败不让整次 CI 红（cursor 下轮还会写）
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git pull --rebase origin main && git push origin HEAD:main; then
              ok=1
              echo "pushed poll cursor (try $i)"
              break
            fi
            echo "push conflict, retry $i"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::poll cursor push failed after retries; next run will continue"
            exit 0
          fi

  stale-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 14-day idle release
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: OpenNoesis
          GITCODE_REPO: vllm
          TASK_BOT_NO_GIT: "1"
          TASK_BOT_MODE: stale
        run: |
          H=$(date -u +%H)
          M=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$H" = "02" ] && [ "$M" -lt 10 ]; }; then
            python team/scripts/task_bot.py
          else
            echo "skip stale this tick"
          fi
